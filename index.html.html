 {id:'organizacion',num:'01',short:'Evolucionar la organización',title:'Tu estructura debe permitir avanzar, no frenar.',desc:'Revisamos cómo se organiza, decide y trabaja tu empresa para que la estrategia se pueda ejecutar.',challenge:'¿Tu estructura, tus procesos o tu modelo de trabajo se quedaron atrás?',problems:['Decisiones que se atascan entre áreas','Roles y responsabilidades poco claros','Procesos que dificultan la ejecución'],audience:'Organizaciones en crecimiento, reestructuración, integración o rediseño de su modelo operativo.',benefits:['Mayor claridad sobre roles, decisiones y responsabilidades','Modelos operativos conectados con la estrategia','Procesos más simples y coordinados','Mejores condiciones para adaptarse'],services:['Transformación y diseño organizacional','Nuevas formas de trabajo y agilidad'],color:'#d8e9d5',faq:[['¿Necesitamos una reestructuración completa?','No necesariamente. El trabajo comienza entendiendo dónde existen fricciones y qué ajustes —incrementales o estructurales— aportarían más valor.'],['¿Cómo participan los equipos?','Combinamos entrevistas, información organizacional y espacios de cocreación para construir propuestas aplicables al contexto real.'],['¿Se contempla la implementación?','Sí. El diseño puede acompañarse de pilotos, comunicación, gobierno de cambios y seguimiento a la adopción.']]},
 {id:'talento',num:'02',short:'Preparar el talento',title:'Las capacidades de mañana se construyen hoy.',desc:'Conectamos la estrategia de talento, las habilidades y el aprendizaje con las prioridades reales del negocio.',challenge:'¿Tu empresa tiene las capacidades que necesitará para lo que viene?',problems:['Habilidades críticas que no se están desarrollando','Procesos de talento desconectados del negocio','Formación sin una ruta clara de aplicación'],audience:'Equipos de dirección y talento que quieren anticipar capacidades, fortalecer su arquitectura de talento y acelerar el aprendizaje.',benefits:['Prioridades de desarrollo más claras','Sistemas de talento alineados al negocio','Trayectorias de aprendizaje con aplicación','Mayor preparación para nuevos roles y tecnologías'],services:['Gestión estratégica del talento humano','Formación y desarrollo del talento'],color:'#ece6d9',faq:[['¿Por dónde empezar si no conocemos las brechas?','Podemos comenzar con un diagnóstico de capacidades críticas vinculado a la estrategia y los cambios esperados.'],['¿Solo diseñan programas de capacitación?','No. También abordamos sistemas de talento, competencias, desempeño, planificación y experiencias de aprendizaje.'],['¿Incluye nuevas habilidades asociadas a IA?','Sí, cuando sean relevantes para los roles y la evolución del trabajo, con un enfoque práctico y contextual.']]},
 {id:'cambio',num:'03',short:'Movilizar el cambio',title:'Una transformación necesita más que un plan.',desc:'Preparamos líderes y equipos para entender, asumir y sostener nuevas maneras de trabajar.',challenge:'¿Tu transformación está diseñada, pero cuesta que las personas la adopten?',problems:['Resistencia o cansancio frente a iniciativas','Líderes sin herramientas para movilizar equipos','Tecnología implementada con baja adopción'],audience:'Empresas que emprenden transformaciones culturales, tecnológicas u organizacionales y necesitan alinear a quienes las harán realidad.',benefits:['Mayor preparación de personas y líderes','Conversaciones y decisiones más alineadas','Procesos de adopción con seguimiento','Capacidad interna para sostener transformaciones'],services:['Gestión del cambio','Coaching y liderazgo'],color:'#d9dedf',faq:[['¿Cuándo conviene involucrar gestión del cambio?','Idealmente desde la definición de la transformación, aunque también es posible intervenir en iniciativas que ya están en marcha.'],['¿Trabajan con líderes o con toda la organización?','El alcance depende del desafío; se pueden combinar equipos directivos, mandos medios y grupos afectados por el cambio.'],['¿Cómo se evalúa la adopción?','Se definen indicadores adecuados al cambio concreto, como comportamientos observables, uso y retroalimentación de los equipos.']]},
 {id:'experiencia',num:'04',short:'Mejorar la experiencia de trabajo',title:'El desempeño también depende de cómo se vive el trabajo.',desc:'Diseñamos culturas y entornos que favorezcan el compromiso, la colaboración y un bienestar sostenible.',challenge:'¿La experiencia diaria de tus equipos ayuda o dificulta sus resultados?',problems:['Desconexión entre cultura declarada y vivida','Señales de desgaste o desmotivación','Experiencias inconsistentes entre equipos'],audience:'Organizaciones que quieren comprender la experiencia de sus personas y mejorar de forma responsable sus prácticas de trabajo.',benefits:['Mayor claridad sobre la experiencia de los equipos','Prácticas culturales conectadas con el día a día','Entornos más saludables y colaborativos','Acciones de bienestar con enfoque organizacional'],services:['Cultura, clima y experiencia del colaborador','Bienestar y salud mental organizacional'],color:'#ead8cd',faq:[['¿Cómo abordan el bienestar organizacional?','Desde las condiciones de trabajo, los riesgos y las prácticas de liderazgo; no únicamente desde actividades de bienestar aisladas.'],['¿Qué diferencia existe entre clima y cultura?','El clima observa percepciones de la experiencia actual; la cultura examina patrones, valores y comportamientos compartidos.'],['¿Incluye medición?','Cuando es pertinente, se plantean diagnósticos y mecanismos de seguimiento cuya metodología se acordaría para cada proyecto.']]}
];

function renderHeader(route){let active=route.split('/')[0], isSol=active==='solucion';document.getElementById('header').innerHTML=`<div class="container nav-wrap">${brand}<nav aria-label="Navegación principal"><ul class="nav-list">${nav.map(([label,href])=>`<li><a href="${href}" ${href.slice(1)===(isSol?'soluciones':active)?'aria-current="page"':''}>${label}</a></li>`).join('')}</ul></nav><div class="header-actions">${A('Hablemos de tu desafío','#contacto','btn btn-dark nav-cta')}<button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></div><nav class="mobile-nav" id="mobile-nav" aria-label="Navegación móvil">${nav.map(([label,href])=>`<a href="${href}">${label}</a>`).join('')}${A('Hablemos de tu desafío','#contacto','btn btn-lime')}</nav>`;document.querySelector('.menu-toggle').addEventListener('click',()=>{let menu=document.querySelector('.mobile-nav'),button=document.querySelector('.menu-toggle');let isOpen=menu.classList.toggle('open');button.setAttribute('aria-expanded',String(isOpen));button.setAttribute('aria-label',isOpen?'Cerrar menú':'Abrir menú')})}
function renderFooter(){document.getElementById('footer').innerHTML=`<div class="container"><div class="footer-main"><div>${brand}<p class="footer-desc">Estrategia organizacional con las personas en el centro. Una propuesta de consultoría para empresas que necesitan evolucionar con intención.</p><span class="tag" style="color:#b5cbb9;border-color:#526a59">Marca conceptual · prototipo</span></div><div class="footer-links"><b>Explorar</b>${nav.map(([l,h])=>`<a href="${h}">${l}</a>`).join('')}<a href="#contacto">Contacto</a></div><div class="footer-links"><b>Soluciones</b>${solutions.map(s=>`<a href="#solucion/${s.id}">${s.short}</a>`).join('')}<a href="#soluciones/servicios">Ver especialidades</a></div></div><div class="footer-low"><span>© 2026 NODO · Concepto de marca provisional, sin actividad comercial representada.</span><span>Prototipo demostrativo · Sin recolección ni envío de datos.</span></div></div>`}
function hero(){return `<section class="hero"><div class="container hero-inner"><div class="hero-copy"><div class="eyebrow">Consultoría de transformación organizacional</div><h1>Diseñamos organizaciones que <span class="serif">avanzan con su gente.</span></h1><p>Conectamos estrategia, talento, liderazgo y cultura para que los cambios no se queden en el papel y puedan convertirse en nuevas formas de trabajar.</p><div class="button-row">${A('Conversemos de tu desafío','#contacto','btn btn-lime')}${A('Explorar soluciones','#soluciones','btn btn-outline-light')}</div><div class="hero-fine">Una mirada estratégica. Una forma humana de transformar.</div></div><div class="hero-visual" role="img" aria-label="Ilustración conceptual: estrategia, organización, personas y cambio conectados alrededor de un centro"><div class="visual-frame"><div class="visual-core"><svg class="core-icon" viewBox="0 0 120 120" fill="none" stroke="#38533a" stroke-width="2.2" aria-hidden="true"><circle cx="60" cy="60" r="43"/><circle cx="60" cy="60" r="17"/><path d="M60 17v26m0 34v26M17 60h26m34 0h26M30 30l18 18m24 24 18 18M90 30L72 48M48 72 30 90"/><circle cx="60" cy="60" r="5" fill="#38533a"/></svg></div><i class="orbit-dot dot1"></i><i class="orbit-dot dot2"></i><i class="orbit-dot dot3"></i><i class="orbit-dot dot4"></i><span class="orbital-label a">Estrategia</span><span class="orbital-label b">Personas</span><span class="orbital-label c">Organización</span><span class="orbital-label d">Evolución</span></div><span class="visual-caption">Conectar para evolucionar / 01</span></div></div><div class="hero-bottom"><div class="container hero-bottom-inner"><span class="hero-bottom-label">De la intención a la acción</span><div class="hero-bottom-words"><span><i></i> Claridad</span><span><i></i> Capacidades</span><span><i></i> Adopción</span><span><i></i> Experiencia humana</span></div></div></div></section>`}
function challenges(){return `<section class="section statement"><div class="container"><div class="eyebrow">Empezamos por tus desafíos</div><div class="statement-intro"><h2>¿Qué necesita cambiar <span class="serif">en tu empresa?</span></h2><p class="lead">No necesitas identificar primero un servicio de consultoría. Identifiquemos juntos el problema que vale la pena resolver.</p></div><div class="challenge-grid">${solutions.map((s,i)=>`<article class="challenge"><div class="challenge-index">${s.num} / ${['Organización','Talento','Cambio','Cultura y bienestar'][i]}</div><h3>${s.short}</h3><p>${s.challenge}</p>${A('Explorar este desafío',`#solucion/${s.id}`)}<div class="challenge-graphic">${graphic(i)}</div></article>`).join('')}</div><div class="service-hint"><p>¿Ya sabes qué especialidad estás buscando? También puedes explorar nuestro catálogo de ocho líneas de servicio.</p>${A('Ver todas las especialidades','#soluciones/servicios')}</div></div></section>`}
function outcomes(){let values=[['Claridad para decidir','Roles, estructuras y prioridades más comprensibles.'],['Capacidad de adaptación','Prácticas que permiten responder mejor a nuevos escenarios.'],['Liderazgo que moviliza','Líderes preparados para acompañar decisiones y personas.'],['Talento preparado','Habilidades y aprendizaje conectados con el negocio.'],['Experiencias de trabajo mejores','Cultura y condiciones que favorecen colaborar y crecer.'],['Cambios que se sostienen','Seguimiento de hábitos y adopción más allá del lanzamiento.']];return `<section class="section outcomes"><div class="container"><div class="eyebrow">Lo que buscamos generar</div><div class="split-head"><h2>El verdadero avance <span class="serif">se nota en cómo trabajamos.</span></h2><p class="section-caption">No vendemos promesas de porcentajes. Diseñamos intervenciones para lograr mejoras relevantes y observables según el contexto de cada organización.</p></div><div class="outcome-grid">${values.map((v,i)=>`<div class="outcome"><span class="outcome-number">0${i+1}</span><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join('')}</div></div></section>`}
function methodHome(){let steps=[['Entender','Escuchamos el contexto, los datos y las tensiones antes de proponer.'],['Diseñar','Cocreamos opciones y priorizamos lo que tiene sentido implementar.'],['Activar','Acompañamos a líderes y equipos para convertir el diseño en práctica.'],['Sostener','Definimos señales de avance y ayudamos a ajustar lo que haga falta.']];return `<section class="section method-home"><div class="container"><div class="eyebrow">Nuestra forma de trabajar</div><div class="split-head"><h2>Menos soluciones en serie.<br><span class="serif">Más transformación en contexto.</span></h2><p class="section-caption">Una forma de trabajo que conecta diagnóstico, cocreación y acompañamiento, sin saltar de la estrategia a una lista de actividades.</p></div><div class="method-rail">${steps.map((s,i)=>`<article class="method-card"><span class="method-step">0${i+1} / 04</span><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('')}</div><div class="method-sequence"><div><strong>El diseño importa. La adopción también.</strong><br><span>La metodología se ajusta a la magnitud y madurez de cada desafío.</span></div>${A('Así trabajamos','#metodo','btn btn-lime')}</div></div></section>`}
function principles(){return `<section class="section principles"><div class="container"><div class="eyebrow">Por qué este enfoque</div><div class="split-head"><h2>Consultoría que conecta <span class="serif">lo que se decide con lo que se vive.</span></h2><p class="section-caption">La confianza se construye con un método claro, entregables útiles y una relación de trabajo transparente; no con logotipos o resultados que aún no existen.</p></div><div class="principle-grid"><article class="principle-card">${graphicMini(0)}<h3>Partimos del negocio.</h3><p>Vinculamos cada intervención con el problema organizacional que necesita resolverse, no con una metodología de moda.</p></article><article class="principle-card">${graphicMini(1)}<h3>Diseñamos con las personas.</h3><p>Involucramos a quienes deciden y a quienes harán posible el cambio, con espacios de escucha y cocreación.</p></article><article class="principle-card">${graphicMini(2)}<h3>Acompañamos la ejecución.</h3><p>Pensamos en capacidades, adopción y seguimiento desde el inicio, no como actividades al final del proyecto.</p></article></div><div class="principle-foot"><span style="width:7px;height:7px;background:#7b9c75;border-radius:50%"></span> Los procesos, alcances y entregables se definen en conjunto antes de iniciar un proyecto.</div></div></section>`}
function graphicMini(n){return n===0?`<svg viewBox="0 0 40 40" fill="none" stroke="#52775d" stroke-width="1.8"><path d="M4 31L17 18l8 6L36 8"/><circle cx="4" cy="31" r="3"/><circle cx="17" cy="18" r="3"/><circle cx="25" cy="24" r="3"/><circle cx="36" cy="8" r="3"/></svg>`:n===1?`<svg viewBox="0 0 40 40" fill="none" stroke="#52775d" stroke-width="1.8"><circle cx="9" cy="11" r="5"/><circle cx="31" cy="11" r="5"/><circle cx="20" cy="28" r="6"/><path d="M12 15l6 8M28 15l-6 8M14 11h12"/></svg>`:`<svg viewBox="0 0 40 40" fill="none" stroke="#52775d" stroke-width="1.8"><circle cx="20" cy="20" r="15"/><path d="M12 20l5 5 11-12" stroke-width="2.4"/></svg>`}
function insightsSection(){return `<section class="section insights-home"><div class="container"><div class="eyebrow">Ideas para pensar mejor el cambio</div><div class="split-head"><h2>Perspectivas para <span class="serif">seguir la conversación.</span></h2><p class="section-caption">Propuestas editoriales para desarrollar próximamente. Aquí no se presentan artículos publicados ni investigación propia verificada.</p></div>${articleCards()}<div style="margin-top:30px">${A('Explorar el espacio de insights','#insights')}</div></div></section>`}
function articleCards(){return `<div class="insight-grid">${articles.map((a,i)=>`<article class="insight-card">${art(i)}<div class="insight-body"><span class="pending">Contenido propuesto</span><span class="kicker" style="margin-top:18px">${a.label}</span><h3>${a.title}</h3><p>${a.desc}</p>${A('Ver propuesta editorial',`#insight/${a.id}`)}</div></article>`).join('')}</div>`}
function finalCta(title='¿Y si empezamos por una buena conversación?',text='Cuéntanos qué está cambiando en tu organización. Podemos comenzar por entender el desafío y explorar si tiene sentido trabajar juntos.'){return `<section class="final-cta"><div class="container"><div class="eyebrow">El siguiente paso</div><h2>${title}</h2><p>${text}</p>${A('Hablemos de tu desafío','#contacto','btn btn-dark')}</div></section>`}
function home(){return hero()+challenges()+outcomes()+methodHome()+principles()+insightsSection()+finalCta()}
function pageHero(kicker,title,lead,buttons=''){return `<section class="page-hero"><div class="container"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="lead">${lead}</p>${buttons?`<div class="button-row">${buttons}</div>`:''}</div></section>`}
function solutionsPage(){return pageHero('Soluciones / dos maneras de encontrar respuestas','Primero el desafío. <span class="serif">Después, la especialidad.</span>','Explora los retos que enfrentan las organizaciones o entra directamente a una disciplina que ya conoces.')+`<section class="section"><div class="container"><div class="eyebrow">Explora a tu manera</div><h2>¿Por dónde <span class="serif">quieres empezar?</span></h2><div class="catalog-switch" role="group" aria-label="Modo de exploración"><button id="by-challenge" aria-pressed="true" type="button">Por desafío</button><button id="by-service" aria-pressed="false" type="button">Por especialidad</button></div><div id="explore-content"></div></div></section>`+`<section class="band"><div class="container band-inner"><h3>Los desafíos no vienen clasificados. Nuestro enfoque tampoco tiene por qué ser rígido.</h3>${A('Explorémoslo juntos','#contacto','btn btn-dark')}</div></section>`+finalCta('Tu desafío puede atravesar varias áreas.','Ayudamos a conectar las piezas y a definir por dónde conviene empezar.')}
function setupSolutions(mode){let out=document.getElementById('explore-content');if(!out)return;let isService=mode==='service';document.getElementById('by-challenge').setAttribute('aria-pressed',String(!isService));document.getElementById('by-service').setAttribute('aria-pressed',String(isService));out.innerHTML=isService?`<p class="small muted" style="margin:0 0 25px">Ocho líneas de especialidad disponibles para proyectos individuales o integrados. Selecciona una para ver sus áreas de intervención.</p><div class="service-list">${catalog.map((c,i)=>`<details class="service-item"><summary><span><span class="topic-label">0${i+1} / Especialidad</span><br>${c.name}</span></summary><div class="service-item-content"><ul>${c.items.map(x=>`<li>${x}</li>`).join('')}</ul><a href="#solucion/${c.rel}">Ver desafío relacionado ${arrow()}</a></div></details>`).join('')}</div>`:`<p class="small muted" style="margin:0 0 25px">Cuatro puertas de entrada para problemas de negocio que suelen necesitar varias disciplinas trabajando juntas.</p><div class="solution-list">${solutions.map(s=>`<a class="solution-row" href="#solucion/${s.id}"><div><span class="num">${s.num} / Desafío empresarial</span><h3>${s.short}</h3><p>${s.challenge}</p><span class="topic-label">${s.services.join(' · ')}</span></div><span class="arrow-circle">${arrow()}</span></a>`).join('')}</div>`;document.getElementById('by-challenge').onclick=()=>setupSolutions('challenge');document.getElementById('by-service').onclick=()=>setupSolutions('service')}
function detailPage(s){const isOrg=s.id==='organizacion';return pageHero(`Soluciones / ${s.num}`,s.title,s.desc,`${A('Conversemos de este desafío',`#contacto/${s.id}`,'btn btn-lime')}${A('Ver todas las soluciones','#soluciones','btn btn-outline-light')}`)+`<section class="section"><div class="container"><div class="intro-grid"><div><div class="eyebrow">El desafío detrás de la solución</div><h2>${s.challenge}</h2></div><p>Las soluciones efectivas empiezan por entender cómo interactúan estructura, decisiones, habilidades y comportamientos. Por eso trabajamos a partir del contexto de cada organización y no de una receta predefinida.</p></div><div class="detail-problem-grid" style="margin-top:44px">${s.problems.map((p,i)=>`<div class="detail-problem"><b>0${i+1}</b><h3>${p}</h3><p>Una señal a explorar en el diagnóstico, no una conclusión anticipada sobre tu empresa.</p></div>`).join('')}</div></div></section><section class="section" style="background:#e8eee5"><div class="container"><div class="detail-two"><div><div class="eyebrow">Para quién es</div><h2>Cuando hay que pasar <span class="serif">de la intención a la realidad.</span></h2><p class="lead muted">${s.audience}</p></div><div><div class="eyebrow">Mejoras que buscamos habilitar</div><ul class="bullet-list">${s.benefits.map(b=>`<li>${b}</li>`).join('')}</ul><p class="small muted">Beneficios esperados; no resultados comprobados ni compromisos de impacto medido.</p></div></div></div></section><section class="section" style="background:#fffefa"><div class="container"><div class="split-head"><div><div class="eyebrow">Capacidades que articulamos</div><h2>Una solución integral, <span class="serif">no una caja cerrada.</span></h2></div><p class="section-caption">Los servicios específicos se seleccionan según alcance, contexto y prioridades. También pueden contratarse de forma independiente.</p></div><div class="detail-service-chips">${s.services.map(x=>`<span>${x}</span>`).join('')}</div><div style="margin-top:32px">${A('Ver catálogo completo de especialidades','#soluciones/servicios')}</div></div></section><section class="section"><div class="container"><div class="dark-slab"><div class="eyebrow" style="color:var(--lime)">Cómo intervenimos</div><h2>Diagnóstico, diseño conjunto, implementación y aprendizaje.</h2><p class="lead">Definimos con el equipo responsable el problema, el alcance, los entregables, los espacios de participación y las señales que permitirán dar seguimiento al trabajo.</p><div class="button-row" style="margin-top:26px">${A('Explora el método','#metodo','btn btn-lime')}</div></div></div></section><section class="section" style="background:#e8eee5"><div class="container"><div class="eyebrow">Preguntas frecuentes</div><h2>Antes de <span class="serif">dar el primer paso.</span></h2><div class="faq-list" style="margin-top:34px">${s.faq.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div></div></section>`+finalCta('Hablemos de lo que tu organización necesita ahora.','Una conversación exploratoria para entender el contexto y acordar, si existe encaje, cuál podría ser el siguiente paso.')}
function aboutPage(){return pageHero('Nosotros / filosofía','Organizaciones más capaces. <span class="serif">Personas más protagonistas.</span>','NODO es una propuesta de consultoría concebida para conectar decisiones estratégicas con el funcionamiento real de las organizaciones.')+`<section class="section"><div class="container intro-grid"><div><div class="eyebrow">Lo que creemos</div><h2>El cambio es estratégico. <span class="serif">Y profundamente humano.</span></h2></div><div><p>No hay diseño organizacional que funcione sin claridad en las decisiones. Ni estrategia de transformación que avance sin liderazgo, capacidades y confianza.</p><p>Por eso planteamos una práctica que combina pensamiento sistémico, participación y acompañamiento de la ejecución.</p></div></div></section><section class="section" style="background:#e8eee5"><div class="container"><div class="eyebrow">Principios de trabajo propuestos</div><h2>Una manera de <span class="serif">hacer consultoría.</span></h2><div class="pillars" style="margin-top:38px"><article class="pillar"><span class="topic-label">01 / Rigor</span><h3>Entender antes de recomendar.</h3><p>Explorar datos, conversaciones y dinámicas que explican los síntomas antes de elegir soluciones.</p></article><article class="pillar"><span class="topic-label">02 / Colaboración</span><h3>Construir con el equipo.</h3><p>Escuchar perspectivas y generar apropiación en quienes tomarán decisiones y pondrán el cambio en práctica.</p></article><article class="pillar"><span class="topic-label">03 / Pragmatismo</span><h3>Dejar capacidad instalada.</h3><p>Priorizar diseños útiles, aprendizaje práctico y seguimiento que faciliten la autonomía de los equipos.</p></article></div></div></section><section class="section"><div class="container"><div class="split-head"><div><div class="eyebrow">Equipo y trayectoria</div><h2>La credibilidad requiere <span class="serif">evidencia real.</span></h2></div><p class="section-caption">Al tratarse de una empresa en formación, reservamos este espacio para información comprobable sobre sus integrantes y experiencia.</p></div><div class="placeholder"><div class="placeholder-label">Espacio pendiente de completar · no representa una persona real</div><h3>Conoce al equipo fundador</h3><p>Incorporar nombres, fotografías, trayectoria profesional verificable, áreas de especialidad y credenciales únicamente cuando estén disponibles y autorizadas para publicación.</p></div></div></section>`+finalCta('Las mejores relaciones empiezan con claridad.','Conversemos sobre tus prioridades y sobre cómo sería trabajar juntos.')}
function methodPage(){let s=[['Entender','Diagnóstico y contexto','Comprendemos el desafío de negocio, la situación actual, las personas involucradas y las restricciones reales.','Mapa del desafío · Hipótesis de trabajo · Alcance acordado'],['Diseñar','Opciones y cocreación','Desarrollamos alternativas, definimos decisiones clave y validamos con las personas que necesitarán llevarlas a la práctica.','Diseño objetivo · Hoja de ruta · Criterios de priorización'],['Activar','Acompañamiento y adopción','Apoyamos el despliegue del diseño mediante liderazgo, comunicación, capacidades y mecanismos de coordinación.','Pilotos y acciones · Habilitación de equipos · Plan de adopción'],['Sostener','Aprendizaje y ajuste','Revisamos señales de avance, fricciones y aprendizajes para ajustar y dejar capacidades dentro de la organización.','Indicadores acordados · Aprendizajes · Plan de continuidad']];return pageHero('Cómo trabajamos / enfoque','El cambio no termina <span class="serif">cuando entregamos el diseño.</span>','Una metodología consultiva que acompaña desde la comprensión del problema hasta las prácticas que permiten sostener la evolución.')+`<section class="section"><div class="container"><div class="eyebrow">Cuatro momentos conectados</div><h2>Un proceso claro, <span class="serif">adaptable a cada reto.</span></h2><div class="process-list" style="margin-top:46px">${s.map((e,i)=>`<article class="process-item"><span class="number">0${i+1}</span><div><span class="topic-label">${e[1]}</span><h3>${e[0]}</h3><p>${e[2]}</p></div><div class="deliverables"><b>Ejemplos de entregables posibles</b>${e[3]}<p class="small muted" style="margin-bottom:0;margin-top:12px">A confirmar según alcance, no un paquete garantizado.</p></div></article>`).join('')}</div></div></section><section class="band"><div class="container band-inner"><h3>Definimos alcance, responsabilidades, hitos y entregables con transparencia antes de comenzar.</h3>${A('Conversemos','#contacto','btn btn-dark')}</div></section>`+finalCta('Del problema compartido a un camino posible.','El primer paso es comprender qué se quiere lograr, qué limita el avance y quiénes necesitan participar.')}
function insightsPage(){return pageHero('Insights / perspectiva editorial','Buenas preguntas para <span class="serif">pensar mejores organizaciones.</span>','Ideas y temas para explorar transformación, talento, liderazgo, cultura y nuevas formas de trabajar.')+`<section class="section insights-home"><div class="container"><div class="eyebrow">Agenda editorial en preparación</div><div class="split-head"><h2>Temas que vale <span class="serif">la pena discutir.</span></h2><p class="section-caption">Los títulos y las fichas son propuestas. No se representan como artículos publicados, investigaciones o resultados comprobados.</p></div>${articleCards()}</div></section>`+finalCta('¿Hay una pregunta que tu equipo necesita responder?','Podemos comenzar con una conversación sobre el desafío que la inspira.')}
function insightDetailPage(a){return pageHero('Insights / contenido en preparación',a.title,`${a.label} · Propuesta de contenido editorial, no publicación definitiva.`)+`<section class="section"><div class="container insight-detail"><span class="tag" style="color:#536f5c">Borrador temático · pendiente de investigación y redacción</span><h2>El punto de partida</h2><p>${a.desc}</p><p>Esta página muestra cómo funcionaría la lectura de un insight en el sitio final. Por transparencia, su contenido todavía es un esquema de trabajo: deberá desarrollarse con fuentes, ejemplos y criterio experto antes de publicarse.</p><h2>Preguntas para desarrollar</h2><ul class="bullet-list"><li>¿Qué decisiones organizacionales conviene revisar primero?</li><li>¿Cómo participarán líderes y personas afectadas en el cambio?</li><li>¿Qué señales permitirán aprender y ajustar el enfoque?</li></ul><div style="margin-top:42px">${A('Volver a insights','#insights')}</div></div></section>`+finalCta()}
function contactPage(topic){let selected=solutions.find(x=>x.id===topic);return pageHero('Contacto / primera conversación','Empecemos por <span class="serif">entender tu desafío.</span>','Sin diagnósticos automáticos ni promesas prematuras. Cuéntanos qué ocurre en tu organización y qué te gustaría explorar.')+`<section class="section"><div class="container contact-grid"><aside class="contact-side"><div class="eyebrow">Una conversación exploratoria</div><h2>Una primera charla. <span class="serif">Sin compromiso.</span></h2><p>El propósito sería escuchar el contexto, identificar objetivos y acordar si existe un camino de colaboración que valga la pena profundizar.</p><div class="contact-note"><b>En el sitio definitivo</b><br>Este espacio podrá conectarse con un correo corporativo, un CRM y un calendario de reuniones cuando existan las integraciones y los avisos legales correspondientes.</div><div class="contact-note"><b>Información de contacto</b><br>Pendiente de definición. No se publican direcciones ni números ficticios.</div></aside><div class="form-panel"><h3>Cuéntanos un poco</h3><p><b>Formulario de demostración.</b> Los datos que escribas no se envían a ningún servidor ni se almacenan. Sirve para probar el recorrido de contacto.</p><form id="contact-form"><div class="form-grid"><div class="field"><label for="nombre">Nombre <span aria-hidden="true">*</span></label><input required maxlength="90" id="nombre" name="nombre" autocomplete="name" placeholder="Tu nombre"></div><div class="field"><label for="correo">Correo de trabajo <span aria-hidden="true">*</span></label><input required maxlength="120" id="correo" name="correo" type="email" autocomplete="email" placeholder="nombre@empresa.com"></div><div class="field full"><label for="empresa">Organización <span aria-hidden="true">*</span></label><input required maxlength="120" id="empresa" name="empresa" autocomplete="organization" placeholder="Nombre de tu organización"></div><div class="field full"><label for="tema">¿Qué desafío te gustaría explorar?</label><select id="tema" name="tema"><option value="">Aún no estoy seguro/a</option>${solutions.map(s=>`<option value="${s.id}" ${selected&&selected.id===s.id?'selected':''}>${s.short}</option>`).join('')}</select></div><div class="field full"><label for="mensaje">¿Qué está ocurriendo en tu organización? <span aria-hidden="true">*</span></label><textarea id="mensaje" name="mensaje" required maxlength="1200" placeholder="Comparte en pocas líneas el contexto, la necesidad o las preguntas que quieres explorar."></textarea></div></div><div class="button-row"><button type="submit" class="btn btn-dark">Previsualizar solicitud ${arrow()}</button></div><p class="form-hint" style="margin:15px 0 0">* Campos obligatorios. Prueba local sin transmisión de datos. Evita incluir información confidencial.</p></form><div id="form-result" class="form-result" role="status" aria-live="polite"><h4>Vista previa lista · no se envió nada</h4><p id="result-description">Puedes revisar el resumen de lo ingresado. En la versión final este formulario requerirá un servicio de envío y aviso de privacidad.</p><div class="button-row"><button type="button" id="copy-summary" class="btn btn-outline">Copiar resumen ${arrow()}</button></div></div></div></div></section>`}
function setupContact(){let f=document.getElementById('contact-form');if(!f)return;f.addEventListener('submit',e=>{e.preventDefault();if(!f.reportValidity())return;let d=new FormData(f),selected=solutions.find(s=>s.id===d.get('tema'));let summary=`SOLICITUD DE CONTACTO (DEMO — NO ENVIADA)\nNombre: ${d.get('nombre')}\nCorreo: ${d.get('correo')}\nOrganización: ${d.get('empresa')}\nDesafío: ${selected?selected.short:'Por definir'}\nMensaje: ${d.get('mensaje')}`;let result=document.getElementById('form-result');result.classList.add('show');document.getElementById('result-description').textContent='Este resumen se preparó únicamente en tu navegador. No se envió ni almacenó ninguna información. Puedes copiarlo si deseas conservarlo.';document.getElementById('copy-summary').onclick=async()=>{try{await navigator.clipboard.writeText(summary);document.getElementById('result-description').textContent='Resumen copiado. Ningún dato fue enviado.'}catch{let el=document.createElement('textarea');el.value=summary;document.body.appendChild(el);el.select();try{document.execCommand('copy');document.getElementById('result-description').textContent='Resumen copiado. Ningún dato fue enviado.'}catch{document.getElementById('result-description').textContent='No fue posible copiar automáticamente desde este navegador.'}el.remove()}};result.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'})})}
function route(){let r=decodeURIComponent(location.hash.replace(/^#/,''))||'inicio';if(r==='contenido'){document.getElementById('contenido').focus();return}let [page,id]=r.split('/'),p='';if(page==='inicio')p=home();else if(page==='soluciones')p=solutionsPage();else if(page==='solucion'){let s=solutions.find(x=>x.id===id);p=s?detailPage(s):solutionsPage()}else if(page==='nosotros')p=aboutPage();else if(page==='metodo')p=methodPage();else if(page==='insights')p=insightsPage();else if(page==='insight'){let a=articles.find(x=>x.id===id);p=a?insightDetailPage(a):insightsPage()}else if(page==='contacto')p=contactPage(id);else{page='inicio';p=home()};renderHeader(page);document.getElementById('contenido').innerHTML=p;renderFooter();document.title=(page==='inicio'?'NODO · Consultoría para organizaciones que evolucionan':`${page==='solucion'?(solutions.find(x=>x.id===id)||{}).short:({'soluciones':'Soluciones','nosotros':'Nosotros','metodo':'Cómo trabajamos','insights':'Insights','insight':'Perspectivas','contacto':'Contacto'})[page]||'NODO'} · NODO`);if(page==='soluciones'){setupSolutions(id==='servicios'?'service':'challenge')}if(page==='contacto')setupContact();window.scrollTo({top:0,behavior:'instant'});if(hasRendered){document.getElementById('contenido').focus({preventScroll:true})}hasRendered=true;if(page==='soluciones'&&id==='servicios'){requestAnimationFrame(()=>document.querySelector('.catalog-switch')?.scrollIntoView({block:'center',behavior:'instant'}))}}
window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(e.key==='Escape'){const mob=document.querySelector('.mobile-nav');if(mob&&mob.classList.contains('open')){mob.classList.remove('open');const b=document.querySelector('.menu-toggle');b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Abrir menú');b.focus()}}});route();
})();
</script>
</body>
</html>
