<title>NODO · Consultoría para organizaciones que evolucionan</title>
<style>
/* ============ TOKENS · único lugar donde viven los colores ============ */
:root{
 /* Paleta base: «Verde» (identidad actual, con contraste corregido) */
 --night:#13241e;--ink:#172923;--ink-2:#2c453b;
 --paper:#f7f5ef;--white:#fffefa;
 --accent:#d6ec78;--accent-hover:#e6f5a2;--on-accent:#172923;--accent-active:#c2d851;
 color-scheme:light;--text-placeholder:#616988;--text-disabled:#6f749b;--danger:#b02b27;
 --surface:#e8eee5;
 --line:#d3dacd;--line-strong:#8fa397;
 --muted:#4a5f56;--muted-night:#c6d4ca;--on-night:#f3f6ed;
 --link-active:#4f6a14;--focus:#56700f;--focus-dark:#d6ec78;
 --c1:#d8e9d5;--c2:#ece6d9;--c3:#d9dedf;--c4:#ead8cd;
 --g1:#3d6b52;--g2:#7a5f4c;--g3:#4d6868;--g4:#84564a;
 --ok-bg:#edf2eb;
 --radius:22px;--max:1240px;
 /* Muestras del panel de prueba (se ven igual con cualquier paleta activa) */
 --sv1:#13241e;--sv2:#d6ec78;--sv3:#f7f5ef;
 --sa1:#121b3c;--sa2:#c4b8ff;--sa3:#f6f7fc;
 --sb1:#1b1240;--sb2:#9ed4ff;--sb3:#f8f6fd;
 --sc1:#141c47;--sc2:#d6ec78;--sc3:#f6f6fc;
}
[data-palette="A"]{
 --night:#121b3c;--ink:#161e42;--ink-2:#2a3568;
 --paper:#f6f7fc;--white:#ffffff;
 --accent:#c4b8ff;--accent-hover:#d6ceff;--accent-active:#b1a3f0;--on-accent:#161e42;
 --surface:#e8ebf8;
 --line:#d5d9ec;--line-strong:#8a93bd;
 --muted:#4a5575;--muted-night:#c9d0ea;--on-night:#f3f5fd;
 --link-active:#3c218d;--focus:#5b3fd9;--focus-dark:#c4b8ff;
 --c1:#dfe3fa;--c2:#ece6f5;--c3:#dbe6f4;--c4:#f0ddd5;
 --g1:#3c4a9a;--g2:#5b4bb0;--g3:#3f6a8f;--g4:#9a5b49;
 --ok-bg:#eef0fa;
}
[data-palette="B"]{
 --night:#1b1240;--ink:#1f1647;--ink-2:#352a70;
 --paper:#f8f6fd;--white:#ffffff;
 --accent:#9ed4ff;--accent-hover:#bde3ff;--accent-active:#84c0ef;--on-accent:#1f1647;
 --surface:#ece8f8;
 --line:#ddd7ee;--line-strong:#948bb8;
 --muted:#554a75;--muted-night:#d3cbec;--on-night:#f6f3fd;
 --link-active:#21608d;--focus:#5a32c8;--focus-dark:#9ed4ff;
 --c1:#e3dcff;--c2:#d8ebfa;--c3:#e9e3f5;--c4:#f0ddd5;
 --g1:#4d33a8;--g2:#1f5f8f;--g3:#6b4bb8;--g4:#9a5b49;
 --ok-bg:#f1eefa;
}
[data-palette="C"]{
 --night:#141c47;--ink:#171f45;--ink-2:#2b3670;
 --paper:#f6f6fc;--white:#ffffff;
 --accent:#d6ec78;--accent-hover:#e6f5a2;--on-accent:#171f45;
 --surface:#e9eaf8;
 --line:#d7d9ee;--line-strong:#8187b2;
 --muted:#4f5778;--muted-night:#cbd0ec;--on-night:#f3f5fd;
 --link-active:#371698;--focus:#5b3fd9;--focus-dark:#d6ec78;
 --c1:#dde1f8;--c2:#e6dffa;--c3:#e5eccb;--c4:#f0ddd5;
 --g1:#2c3b94;--g2:#4a2fb0;--g3:#5a7a1f;--g4:#9a5b49;
 --ok-bg:#eef0fa;
}
/* ============ Base ============ */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
svg{max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin-top:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.dark{--focus:var(--focus-dark)}
::selection{background:var(--accent);color:var(--on-accent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:fixed;z-index:300;left:16px;top:-80px;padding:12px 18px;background:var(--accent);color:var(--on-accent);border-radius:8px;font-weight:700}
.skip:focus{top:12px}
.container{width:min(calc(100% - 40px),var(--max));margin-inline:auto}
.section{padding:clamp(64px,9vw,112px) 0}
.surface{background:var(--surface)}
.surface-white{background:var(--white)}
.muted{color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;line-height:1.4;margin-bottom:20px}
.eyebrow:before{content:"";flex:0 0 22px;height:2px;background:currentColor}
.topic-label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--link-active)}
h1,h2{letter-spacing:-.045em;font-weight:600;line-height:1.06}
h1{font-size:clamp(2.25rem,1.2rem + 5.2vw,5.4rem)}
h2{font-size:clamp(1.9rem,1.1rem + 3.4vw,3.8rem)}
h3{font-size:clamp(1.25rem,1.05rem + .8vw,1.75rem);letter-spacing:-.03em;line-height:1.2;font-weight:700}
h1,h2,h3{hyphens:manual}
h1:focus{outline:none}
.serif{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;letter-spacing:-.05em}
.lead{font-size:clamp(1.0625rem,1rem + .35vw,1.3125rem);line-height:1.6;max-width:680px}
.small{font-size:14px;line-height:1.6}
.prose a,.link-u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.tag{display:inline-flex;align-items:center;border:1px solid currentColor;border-radius:80px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* ============ Botones y enlaces ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:48px;padding:13px 24px;border:1px solid transparent;border-radius:100px;font-size:15px;font-weight:800;line-height:1.2;text-align:center;transition:transform .2s,background-color .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn svg,.inline-link svg{width:16px;height:16px;flex:0 0 16px;transition:transform .2s}
.btn:hover svg,.inline-link:hover svg{transform:translateX(4px)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{background:var(--accent-hover)}
.btn-dark{background:var(--ink);color:var(--white)}
.btn-dark:hover{background:var(--ink-2)}
.btn-outline{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-outline:hover{background:var(--white)}
.btn-outline-light{border-color:var(--muted-night);color:var(--on-night)}
.btn-outline-light:hover{background:color-mix(in srgb,var(--white) 10%,transparent)}
.inline-link{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:800;border-bottom:1px solid currentColor;transition:gap .2s}
.inline-link:hover{gap:16px}
.button-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ============ Cabecera ============ */
.site-header{position:sticky;top:0;z-index:100;background:var(--paper);background:color-mix(in srgb,var(--paper) 96%,transparent);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav-wrap{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:44px}
.brand-mark{width:35px;height:35px;display:inline-grid;place-items:center}
.brand-name{display:flex;flex-direction:column;line-height:1}
.brand-name b{font-size:25px;letter-spacing:-.08em;font-weight:900}
.brand-name small{font-size:12px;letter-spacing:.16em;font-weight:800;margin-top:4px}
.nav-list{display:flex;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.nav-list a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;font-size:14px;font-weight:700;color:var(--ink-2);border-radius:8px;transition:color .2s,background-color .2s}
.nav-list a:hover{background:var(--surface)}
.nav-list a[aria-current=page]{color:var(--link-active);box-shadow:inset 0 -2px 0 currentColor;border-radius:0}
.header-actions{display:flex;align-items:center;gap:12px}
.nav-cta{min-height:44px;padding:10px 20px;white-space:nowrap;font-size:14px}
.menu-toggle{display:none;align-items:center;justify-content:center;width:46px;height:46px;border:1px solid var(--line-strong);border-radius:50%;background:transparent}
.menu-toggle svg{width:22px;height:22px}
.mobile-nav{display:none;padding:10px 20px 24px;border-top:1px solid var(--line);background:var(--paper);max-height:calc(100vh - 69px);max-height:calc(100dvh - 69px);overflow-y:auto;overscroll-behavior:contain}
.mobile-nav.open{display:block}
.mobile-nav a:not(.btn){display:flex;align-items:center;min-height:52px;font-size:18px;font-weight:700;border-bottom:1px solid var(--line)}
.mobile-nav a[aria-current=page]{color:var(--link-active)}
.mobile-nav .btn{margin-top:18px;display:flex;width:100%}

/* ============ Hero ============ */
.hero{background:var(--night);color:var(--on-night);position:relative;overflow:hidden;isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 40%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 45%);pointer-events:none;z-index:-1}
.hero-inner{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;gap:40px;padding-top:72px;padding-bottom:64px}
.hero .eyebrow{color:var(--accent)}
.hero h1{max-width:12.5em;margin-bottom:26px;font-size:clamp(2.25rem,1.2rem + 4.4vw,4.6rem)}
.hero h1 .serif{color:var(--accent)}
.hero-sub{color:var(--muted-night);max-width:520px;font-size:clamp(1.0625rem,1rem + .3vw,1.1875rem);line-height:1.7;margin-bottom:30px}
.hero-visual{width:min(100%,500px);margin-inline:auto}
.visual-wrap{position:relative}
.visual{position:relative;aspect-ratio:1;width:100%}
.ring-fixed{position:absolute;inset:0;border:1px solid var(--muted-night);border-radius:50%;opacity:.55}
.ring-fixed.r2{inset:15%;border-style:dashed;opacity:.4}
.ring-fixed.r3{inset:29%;opacity:.25}
.ring{position:absolute;inset:0;animation:spin 140s linear infinite}
.visual.paused .ring{animation-play-state:paused}
.dot{position:absolute;width:20px;height:20px;border:5px solid var(--night);background:var(--accent);border-radius:50%;box-shadow:0 0 0 1px var(--muted-night)}
.dot.d1{top:-2%;left:calc(50% - 10px)}.dot.d2{top:calc(50% - 10px);right:-2%}.dot.d3{bottom:-2%;left:calc(50% - 10px)}.dot.d4{top:calc(50% - 10px);left:-2%}
.core{position:absolute;inset:25.5%;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 90px color-mix(in srgb,var(--accent) 22%,transparent)}
.core svg{width:56%;height:56%}
.orbital-labels{position:absolute;inset:0;pointer-events:none}
.orbital-labels a{position:absolute;pointer-events:auto;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:80px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 12px 30px color-mix(in srgb,var(--night) 55%,transparent);transition:transform .2s,background-color .2s}
.orbital-labels a:hover{transform:translateY(-2px);background:var(--accent)}
.orbital-labels .a{top:6%;right:0}.orbital-labels .b{right:0;bottom:14%;background:var(--c1)}.orbital-labels .c{bottom:5%;left:0;background:var(--c4)}.orbital-labels .d{left:0;top:22%;background:var(--c2)}
.motion-toggle{display:flex;align-items:center;gap:8px;margin:16px auto 0;min-height:44px;padding:0 14px;border:1px solid var(--muted-night);border-radius:80px;background:transparent;color:var(--muted-night);font-size:13px;font-weight:700}
.motion-toggle:hover{background:color-mix(in srgb,var(--white) 10%,transparent)}
.motion-toggle svg{width:14px;height:14px}
.proof{border-top:1px solid color-mix(in srgb,var(--muted-night) 35%,transparent)}
.proof-inner{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.proof-item{display:flex;gap:12px;align-items:flex-start;padding:22px 20px 22px 0;font-size:14px;line-height:1.5;color:var(--on-night)}
.proof-item svg{flex:0 0 18px;width:18px;height:18px;margin-top:2px;color:var(--accent)}
.proof-item a{display:flex;gap:12px;align-items:flex-start;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.proof-item.slot{color:var(--muted-night)}

/* ============ Encabezados de sección ============ */
.split-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.65fr);gap:30px;align-items:end;margin-bottom:44px}
.section-caption{font-size:16px;line-height:1.7;color:var(--muted);max-width:420px;margin:0 0 4px auto}

/* ============ Desafíos ============ */
.challenge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.challenge{min-height:340px;position:relative;overflow:hidden;border-radius:var(--radius);padding:34px;display:flex;flex-direction:column;align-items:flex-start;transition:transform .25s,box-shadow .25s}
.challenge:hover{transform:translateY(-4px);box-shadow:0 24px 60px color-mix(in srgb,var(--night) 14%,transparent)}
.challenge:nth-child(1){background:var(--c1)}.challenge:nth-child(2){background:var(--c2)}.challenge:nth-child(3){background:var(--c3)}.challenge:nth-child(4){background:var(--c4)}
.challenge-index{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.challenge h3{font-size:clamp(1.625rem,1.2rem + 1.4vw,2.5rem);max-width:11em;line-height:1.1;margin:22px 0 10px;position:relative;z-index:2}
.challenge p{font-size:16px;line-height:1.6;max-width:20em;position:relative;z-index:2}
.challenge .inline-link{margin-top:auto;position:relative;z-index:3}
.challenge-graphic{position:absolute;width:210px;height:210px;right:-26px;bottom:-14px;opacity:.7;pointer-events:none}
.challenge-graphic svg{width:100%;height:100%}
.service-hint{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;padding-top:22px}
.service-hint p{margin:0;color:var(--muted)}

/* ============ Entrada por rol ============ */
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:8px}
.role{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px}
.role h3{font-size:19px;margin-bottom:12px}
.role ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.role a{display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;color:var(--link-active)}
.role a:hover{text-decoration-thickness:2px}
.note{border:1px dashed var(--line-strong);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.55;color:var(--muted);background:var(--ok-bg)}
.note b{color:var(--ink)}

/* ============ Diagnóstico (teaser) ============ */
.diag-teaser{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px;align-items:center;background:var(--night);color:var(--on-night);border-radius:26px;padding:clamp(28px,5vw,64px);position:relative;overflow:hidden}
.diag-teaser p{color:var(--muted-night)}
.diag-teaser .eyebrow{color:var(--accent)}
.diag-teaser h2{font-size:clamp(1.75rem,1.2rem + 2.4vw,3.2rem)}

/* ============ Resultados ============ */
.outcome-grid{border-top:1px solid var(--line-strong);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.outcome{padding:30px 32px 32px 0;border-bottom:1px solid var(--line-strong)}
.outcome:nth-child(3n+2),.outcome:nth-child(3n+3){padding-left:32px;border-left:1px solid var(--line-strong)}
.outcome-number{font-family:Georgia,serif;font-style:italic;color:var(--link-active);font-size:26px;margin-bottom:18px;display:block}
.outcome h3{font-size:21px;margin-bottom:8px}
.outcome p{font-size:16px;line-height:1.6;color:var(--muted);margin:0;max-width:300px}

/* ============ Método ============ */
.method-rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:44px 0 30px}
.method-card{border-top:2px solid var(--ink);padding:22px 18px 26px 0}
.method-card .step{font-family:Georgia,serif;font-style:italic;color:var(--link-active);font-size:22px;display:block}
.method-card h3{font-size:clamp(1.5rem,1.2rem + 1vw,1.9rem);margin:36px 0 12px}
.method-card p{font-size:16px;line-height:1.65;color:var(--muted)}
.method-bar{display:flex;align-items:center;justify-content:space-between;border-radius:var(--radius);background:var(--night);color:var(--on-night);padding:30px 36px;gap:20px;flex-wrap:wrap}
.method-bar strong{font-size:clamp(1.25rem,1.1rem + .6vw,1.6rem);letter-spacing:-.03em}
.method-bar span{display:block;color:var(--muted-night);margin-top:6px}

/* ============ Principios ============ */
.principle-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.principle-card{padding:32px;background:var(--white);border-radius:18px;display:flex;flex-direction:column}
.principle-card svg{width:40px;height:40px;margin-bottom:28px;color:var(--g1)}
.principle-card h3{font-size:22px;margin-bottom:10px}
.principle-card p{color:var(--muted);margin-bottom:0}

/* ============ Insights ============ */
.insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.insight-card{background:var(--white);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s}
.insight-card:hover{transform:translateY(-4px)}
.insight-art{height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.insight-art svg{width:82%;height:84%;max-width:300px}
.insight-card:nth-child(1) .insight-art{background:var(--c1)}.insight-card:nth-child(2) .insight-art{background:var(--c2)}.insight-card:nth-child(3) .insight-art{background:var(--c3)}
.insight-body{padding:26px;display:flex;flex-direction:column;flex:1;gap:12px}
.insight-body .topic-label{margin-top:4px}
.insight-body h3{font-size:22px;margin:0}
.insight-body p{color:var(--muted);margin:0}
.insight-body .inline-link{margin-top:auto;align-self:flex-start}
.pending{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink-2);background:var(--ok-bg);border:1px solid var(--line-strong);border-radius:50px;padding:5px 11px}

/* ============ CTA final y pie ============ */
.final-cta{background:var(--accent);color:var(--on-accent);padding:clamp(64px,8vw,96px) 0;overflow:hidden;position:relative}
.final-cta:after{content:"";position:absolute;right:-150px;bottom:-290px;border:75px solid color-mix(in srgb,var(--ink) 9%,transparent);border-radius:50%;width:540px;height:540px;pointer-events:none}
.final-cta .container{position:relative;z-index:1}
.final-cta h2{font-size:clamp(2.1rem,1.2rem + 4vw,4.8rem);max-width:14em;margin:0 0 22px}
.final-cta p{font-size:clamp(1.0625rem,1rem + .3vw,1.1875rem);max-width:640px;line-height:1.65;margin-bottom:30px}
footer{background:var(--night);color:var(--on-night);padding:64px 0 26px}
.footer-main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr) minmax(0,.9fr);gap:40px;padding-bottom:48px}

function crumbs(items){return `<nav class="crumbs" aria-label="Ruta de navegación">${items.map((x,i)=>i<items.length-1?`<a href="${x[1]}">${x[0]}</a><span aria-hidden="true">/</span>`:`<span aria-current="page">${x[0]}</span>`).join('')}</nav>`}
function finalCta(title='¿Y si empezamos por una buena conversación?',text='Cuéntanos qué está cambiando en tu organización. Podemos comenzar por entender el desafío y explorar si tiene sentido trabajar juntos.',topic=''){return `<section class="final-cta"><div class="container"><div class="eyebrow">El siguiente paso</div><h2>${title}</h2><p>${text}</p>${A(CTA,topic?`#contacto/${topic}`:'#contacto','btn btn-dark')}</div></section>`}

/* ============ Inicio ============ */
function hero(){const H=HEADLINES[state.h]||HEADLINES.resultado;
 const labels=[['a','cambio','Cambio'],['b','experiencia','Experiencia'],['c','talento','Talento'],['d','organizacion','Organización']];
 return `<section class="hero dark"><div class="container hero-inner"><div class="hero-copy"><div class="eyebrow">Consultoría de transformación organizacional</div><h1 tabindex="-1">${H.h}</h1><p class="hero-sub">${H.s}</p><div class="button-row">${A(CTA,'#contacto','btn btn-accent')}${A('¿Por dónde empezar? Cinco preguntas','#diagnostico','btn btn-outline-light')}</div></div>
 <div class="hero-visual"><div class="visual-wrap"><div class="visual${state.paused?' paused':''}" id="visual"><div class="ring-fixed" aria-hidden="true"></div><div class="ring-fixed r2" aria-hidden="true"></div><div class="ring-fixed r3" aria-hidden="true"></div><div class="ring" aria-hidden="true"><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i><i class="dot d4"></i></div><div class="core" aria-hidden="true"><svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.2" focusable="false"><circle cx="60" cy="60" r="43"/><circle cx="60" cy="60" r="17"/><path d="M60 17v26m0 34v26M17 60h26m34 0h26M30 30l18 18m24 24 18 18M90 30L72 48M48 72 30 90"/><circle cx="60" cy="60" r="5" fill="currentColor"/></svg></div>
 </div><nav class="orbital-labels" aria-label="Los cuatro desafíos">${labels.map(([c,id,l])=>`<a class="${c}" href="#solucion/${id}" aria-label="${l}: ${byId(TERR,id).short}">${l}</a>`).join('')}</nav></div>
 <button type="button" class="motion-toggle" id="motion-toggle" aria-pressed="${state.paused}"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>Pausar movimiento</button></div></div>
 <div class="proof"><div class="container proof-inner"><div class="proof-item"><a href="#metodo">${checkIcon}<span>Un método en cuatro momentos, visible desde el primer día</span></a></div><div class="proof-item">${checkIcon}<span>Alcance, responsabilidades y entregables definidos antes de iniciar</span></div><div class="proof-item">${checkIcon}<span>Diagnóstico y cocreación con tu equipo, no un plan impuesto</span></div><div class="proof-item slot" data-proto>${checkIcon}<span>Espacio para equipo y credenciales verificables · por completar</span></div></div></div></section>`}

function challenges(){return `<section class="section"><div class="container"><div class="eyebrow">Empezamos por tus desafíos</div><div class="split-head"><h2>¿Qué necesita cambiar <span class="serif">en tu empresa?</span></h2><p class="section-caption">No necesitas identificar primero un servicio. Identifiquemos juntos el problema que vale la pena resolver.</p></div>
 <div class="challenge-grid">${TERR.map((s,i)=>`<article class="challenge"><div class="challenge-index">${s.num} / ${s.tag}</div><h3>${s.short}</h3><p>${s.challenge}</p>${A('Explorar este desafío',`#solucion/${s.id}`)}<div class="challenge-graphic">${graphic(i)}</div></article>`).join('')}</div>
 <div class="service-hint"><p>¿Ya sabes qué especialidad buscas? Explora las ocho líneas de servicio.</p>${A('Ver todas las especialidades','#soluciones/servicios')}</div></div></section>`}

function rolesSection(){return `<section class="section surface"><div class="container"><div class="eyebrow">Otra manera de entrar</div><div class="split-head"><h2>¿Desde qué rol <span class="serif">miras el desafío?</span></h2><p class="section-caption">Cada rol suele empezar por puertas distintas. Elige la tuya y ve directo a las soluciones más cercanas.</p></div>
 <div class="roles">${ROLES.map(r=>`<div class="role"><h3>${r.t}</h3><ul>${r.d.map(d=>`<li><a href="#solucion/${d}">${byId(TERR,d).short}</a></li>`).join('')}</ul></div>`).join('')}</div>
 ${proto('<b>Nota de prototipo:</b> la relación entre cada rol y cada desafío es una hipótesis de lenguaje por validar con compradores reales.')}</div></section>`}

function diagTeaser(){return `<section class="section"><div class="container"><div class="diag-teaser dark"><div><div class="eyebrow">Orientación en cinco preguntas</div><h2>¿No sabes por dónde <span class="serif">empezar?</span></h2><p class="lead">Responde cinco preguntas breves y te sugerimos qué desafío explorar primero. No pedimos datos ni guardamos tus respuestas.</p></div><div>${A('Hacer el autodiagnóstico','#diagnostico','btn btn-outline-light')}<p class="small" style="margin:16px 0 0">Es una orientación inicial, no un diagnóstico organizacional.</p></div></div></div></section>`}

function outcomes(){return `<section class="section surface"><div class="container"><div class="eyebrow">Lo que buscamos generar</div><div class="split-head"><h2>El verdadero avance <span class="serif">se nota en cómo trabajamos.</span></h2><p class="section-caption">Mejoras observables, definidas según el contexto de cada organización.</p></div><div class="outcome-grid">${OUTCOMES.map((v,i)=>`<div class="outcome"><span class="outcome-number" aria-hidden="true">0${i+1}</span><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join('')}</div>${proto('<b>Nota de prototipo:</b> no se muestran porcentajes ni métricas porque no existen resultados propios que respalden cifras.')}</div></section>`}

function methodHome(){return `<section class="section surface-white"><div class="container"><div class="eyebrow">Ciclo NODO · nuestra forma de trabajar</div><div class="split-head"><h2>Menos soluciones en serie. <span class="serif">Más transformación en contexto.</span></h2><p class="section-caption">Un método que conecta diagnóstico, cocreación y acompañamiento, sin saltar de la estrategia a una lista de actividades.</p></div>
 <div class="method-rail">${STEPS.map((s,i)=>`<article class="method-card"><span class="step">0${i+1} / 04</span><h3>${s[0]}</h3><p>${s[2]}</p></article>`).join('')}</div>
 <div class="method-bar dark"><div><strong>El diseño importa. La adopción también.</strong><span>El método se ajusta a la magnitud y madurez de cada desafío.</span></div>${A('Así trabajamos','#metodo','btn btn-outline-light')}</div></div></section>`}

function principles(){return `<section class="section"><div class="container"><div class="eyebrow">Cómo nos comprometemos</div><div class="split-head"><h2>Consultoría que conecta <span class="serif">lo que se decide con lo que se vive.</span></h2><p class="section-caption">Un método claro, entregables útiles y una relación de trabajo transparente.</p></div>
 <div class="principle-grid"><article class="principle-card">${mini(0)}<h3>Partimos del negocio.</h3><p>Vinculamos cada intervención con el problema organizacional que necesita resolverse, no con una metodología de moda.</p></article><article class="principle-card">${mini(1)}<h3>Diseñamos con las personas.</h3><p>Involucramos a quienes deciden y a quienes harán posible el cambio, con espacios de escucha y cocreación.</p></article><article class="principle-card">${mini(2)}<h3>Acompañamos la ejecución.</h3><p>Pensamos en capacidades, adopción y seguimiento desde el inicio, no como actividades al final del proyecto.</p></article></div>
 <p class="small muted" style="margin:26px 0 0">Los procesos, alcances y entregables se definen en conjunto antes de iniciar un proyecto.</p></div></section>`}

function articleCards(){return `<div class="insight-grid">${ARTICLES.map((a,i)=>`<article class="insight-card">${art(i)}<div class="insight-body"><span class="pending">Tema en preparación</span><span class="topic-label">${a.label}</span><h3>${a.title}</h3><p>${a.desc}</p>${A('Ver el esquema del tema',`#insight/${a.id}`)}</div></article>`).join('')}</div>`}
function insightsSection(){return `<section class="section surface"><div class="container"><div class="eyebrow">Ideas para pensar mejor el cambio</div><div class="split-head"><h2>Perspectivas para <span class="serif">seguir la conversación.</span></h2><p class="section-caption">Temas que estamos preparando para la conversación con líderes de talento, cultura y transformación.</p></div>${articleCards()}<div style="margin-top:28px">${A('Explorar el espacio de insights','#insights')}</div></div></section>`}

function home(){return hero()+challenges()+rolesSection()+diagTeaser()+outcomes()+methodHome()+principles()+insightsSection()+finalCta()}

 +`<section class="section"><div class="container"><div class="eyebrow">Explora a tu manera</div><h2>¿Por dónde <span class="serif">quieres empezar?</span></h2><div class="switch" role="group" aria-label="Modo de exploración"><button id="by-challenge" aria-pressed="true" type="button">Por desafío</button><button id="by-service" aria-pressed="false" type="button">Por especialidad</button></div><div id="explore-content"></div></div></section>`
 +`<section class="band"><div class="container band-inner"><h3>¿No tienes claro por dónde empezar? Cinco preguntas te orientan.</h3>${A('Hacer el autodiagnóstico','#diagnostico','btn btn-dark')}</div></section>`

 +`<section class="section"><div class="container"><div class="intro-grid"><div><div class="eyebrow">El desafío detrás de la solución</div><h2>${s.challenge}</h2></div><p>${s.intro}</p></div><div class="problem-grid">${s.problems.map((p,i)=>`<div class="problem"><b aria-hidden="true">0${i+1}</b><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join('')}</div></div></section>`

 +`<section class="section surface-white"><div class="container"><div class="split-head"><div><div class="eyebrow">Especialidades que articulamos</div><h2>Una solución integral, <span class="serif">no una caja cerrada.</span></h2></div><p class="section-caption">Se seleccionan según alcance, contexto y prioridades. También pueden contratarse de forma independiente.</p></div><div class="chips">${s.specs.map(x=>`<a href="#especialidad/${x}">${byId(SPEC,x).name}</a>`).join('')}</div><div style="margin-top:28px">${A('Ver todas las especialidades','#soluciones/servicios')}</div></div></section>`

 +`<section class="section surface"><div class="container"><div class="eyebrow">Principios de trabajo</div><h2>Una manera de <span class="serif">hacer consultoría.</span></h2><div class="pillars"><article class="pillar"><span class="topic-label">01 / Rigor</span><h3>Entender antes de recomendar.</h3><p>Explorar datos, conversaciones y dinámicas que explican los síntomas antes de elegir soluciones.</p></article><article class="pillar"><span class="topic-label">02 / Colaboración</span><h3>Construir con el equipo.</h3><p>Escuchar perspectivas y generar apropiación en quienes tomarán decisiones y pondrán el cambio en práctica.</p></article><article class="pillar"><span class="topic-label">03 / Pragmatismo</span><h3>Dejar capacidad instalada.</h3><p>Priorizar diseños útiles, aprendizaje práctico y seguimiento que faciliten la autonomía de los equipos.</p></article></div></div></section>`
 +`<section class="section" data-proto><div class="container"><div class="split-head"><div><div class="eyebrow">Equipo y trayectoria</div><h2>La credibilidad requiere <span class="serif">evidencia real.</span></h2></div><p class="section-caption">Espacio reservado para información comprobable sobre integrantes y experiencia.</p></div><div class="placeholder"><span class="placeholder-label">Espacio pendiente de completar · no representa a una persona real</span><h3>Conoce al equipo fundador</h3><p>Incorporar nombres, fotografías, trayectoria profesional verificable, áreas de especialidad y credenciales únicamente cuando estén disponibles y autorizadas para publicación.</p></div></div></section>`

  )+`<section class="section"><div class="container"><div class="eyebrow">Cuatro momentos conectados</div><h2>Un proceso claro, <span class="serif">adaptable a cada reto.</span></h2><p class="lead muted" style="margin-top:20px">Diagnóstico, cocreación y acompañamiento no son fases separadas: se alimentan entre sí a lo largo del proyecto.</p><div class="process-list" style="margin-top:40px">${STEPS.map((e,i)=>`<article class="process-item"><span class="number" aria-hidden="true">0${i+1}</span><div><span class="topic-label">${e[1]}</span><h3>${e[0]}</h3><p>${e[3]}</p></div><div class="deliverables"><b>Ejemplos de entregables posibles</b>${e[4]}<p class="muted">A confirmar según el alcance; no es un paquete garantizado.</p></div></article>`).join('')}</div></div></section>`

 +`<section class="section surface"><div class="container"><div class="eyebrow">Agenda editorial en preparación</div><div class="split-head"><h2>Temas que vale <span class="serif">la pena discutir.</span></h2><p class="section-caption">Temas para explorar con quienes lideran talento, cultura y transformación.</p></div>${articleCards()}${proto('<b>Nota de prototipo:</b> los títulos son propuestas de contenido; todavía no existen artículos publicados ni investigación propia. Las fichas llevan la etiqueta «Tema en preparación» para no aparentar lo contrario.')}</div></section>`

const state={h:'resultado',paused:false,palette:'C',proto:true};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const PALETTES=[['C','C · Azul + violeta + lima (predeterminada)'],['A','A · Índigo + lavanda'],['B','B · Violeta + celeste'],['verde','Verde anterior, contraste corregido']];
(function initState(){
 const q=new URLSearchParams(location.search);
 const pick=(key,valid,fallback)=>{const v=q.get(key)||store.get('nodo3-'+key);return valid.includes(v)?v:fallback};
 state.palette=pick('paleta',PALETTES.map(p=>p[0]),'C');
 state.h=pick('titular',Object.keys(HEADLINES),'resultado');
 state.proto=pick('notas',['0','1'],'1')==='1';
})();
function applyPalette(){
 const root=document.documentElement;root.setAttribute('data-palette',state.palette);
 const cs=getComputedStyle(root),night=cs.getPropertyValue('--night').trim(),acc=cs.getPropertyValue('--accent').trim();
 const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.setAttribute('content',night);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="${night}"/><circle cx="20" cy="20" r="12" fill="none" stroke="${acc}" stroke-width="2"/><circle cx="20" cy="20" r="4.5" fill="${acc}"/></svg>`;
 let ic=document.querySelector('link[rel=icon]');if(!ic){ic=document.createElement('link');ic.rel='icon';document.head.appendChild(ic)}
 ic.href='data:image/svg+xml,'+encodeURIComponent(svg);
}
function applyProto(){document.body.classList.toggle('hide-proto',!state.proto)}

function buildLab(){
 const wrap=document.createElement('div');
 wrap.innerHTML=`<button type="button" class="lab-btn" id="lab-btn" aria-expanded="false" aria-controls="lab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M3 6h9m4 0h1M3 14h1m4 0h9"/><circle cx="14" cy="6" r="2"/><circle cx="6" cy="14" r="2"/></svg><span>Panel de prueba</span></button>
 <section class="lab" id="lab" hidden aria-labelledby="lab-title"><h2 id="lab-title">Panel de prueba</h2><p>Herramientas del prototipo para comparar opciones. No forman parte del sitio final.</p>
 <fieldset><legend>Paleta de color</legend>${PALETTES.map(([v,l])=>`<label><input type="radio" name="lab-pal" value="${v}"> ${l}<span class="swatches sw-${v}" aria-hidden="true"><i></i><i></i><i></i></span></label>`).join('')}</fieldset>
 <fieldset><legend>Titular del inicio</legend>${Object.entries(HEADLINES).map(([v,h])=>`<label><input type="radio" name="lab-h" value="${v}"> ${h.label}</label>`).join('')}</fieldset>
 <fieldset><legend>Notas</legend><label><input type="checkbox" id="lab-proto"> Mostrar notas de prototipo</label></fieldset>
 <a class="close" href="#notas">Ver notas de prototipo</a> · <button type="button" class="close" id="lab-close" style="background:none;border:0;padding:0;color:inherit">Cerrar</button></section>`;
 document.body.append(...wrap.children);
 const btn=document.getElementById('lab-btn'),lab=document.getElementById('lab');
 const sync=()=>{lab.querySelectorAll('[name=lab-pal]').forEach(r=>r.checked=r.value===state.palette);lab.querySelectorAll('[name=lab-h]').forEach(r=>r.checked=r.value===state.h);document.getElementById('lab-proto').checked=state.proto};
 const setLab=open=>{lab.hidden=!open;btn.setAttribute('aria-expanded',String(open));if(open)sync()};
 btn.addEventListener('click',()=>setLab(lab.hidden));
 document.getElementById('lab-close').addEventListener('click',()=>{setLab(false);btn.focus()});
 lab.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='lab-pal'){state.palette=t.value;store.set('nodo3-paleta',t.value);applyPalette()}
  else if(t.name==='lab-h'){state.h=t.value;store.set('nodo3-titular',t.value);if(currentPage==='inicio')render(false)}
  else if(t.id==='lab-proto'){state.proto=t.checked;store.set('nodo3-notas',t.checked?'1':'0');applyProto()}
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!lab.hidden){setLab(false);btn.focus()}});
 window.nodoSetLab=setLab;
}

 const f=document.getElementById('contact-form');if(!f)return;
 const sumBox=document.getElementById('err-summary'),res=document.getElementById('form-result');
 const rules=[['nombre','Escribe tu nombre.',v=>v.trim().length>0],['correo','Escribe un correo de trabajo con formato válido, por ejemplo nombre@empresa.com.',v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())],['pais','Escribe el país donde trabajas.',v=>v.trim().length>0],['mensaje','Cuéntanos brevemente qué está ocurriendo en tu organización.',v=>v.trim().length>0]];
 const clear=()=>{sumBox.hidden=true;sumBox.innerHTML='';f.querySelectorAll('.field-error').forEach(e=>e.remove());f.querySelectorAll('[aria-invalid]').forEach(i=>{i.removeAttribute('aria-invalid');i.removeAttribute('aria-describedby')})};
 f.addEventListener('submit',e=>{
  e.preventDefault();clear();res.hidden=true;
  const bad=rules.filter(([id,,ok])=>!ok(f.elements[id].value));
  if(bad.length){
   bad.forEach(([id,msg])=>{const el=f.elements[id];el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','err-'+id);const p=document.createElement('p');p.className='field-error';p.id='err-'+id;p.textContent=msg;el.parentNode.appendChild(p)});
   sumBox.innerHTML=`<b>Revisa ${bad.length===1?'este campo':'estos '+bad.length+' campos'} para continuar:</b><ul>${bad.map(([id,msg])=>`<li><a href="#${id}" data-field="${id}">${msg}</a></li>`).join('')}</ul>`;
   sumBox.hidden=false;sumBox.focus();
   sumBox.querySelectorAll('[data-field]').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();f.elements[a.dataset.field].focus()}));
   return;
  }
  const d=new FormData(f),sel=byId(TERR,d.get('tema'));
  const summary=`SOLICITUD DE CONTACTO (DEMO, NO ENVIADA)\nNombre: ${d.get('nombre')}\nCorreo: ${d.get('correo')}\nPaís: ${d.get('pais')}\nDesafío: ${sel?sel.short:'Por definir'}\nMensaje: ${d.get('mensaje')}`;
  res.innerHTML=`<h3>Vista previa lista · no se envió nada</h3><p class="small" style="margin:0">Este resumen se preparó únicamente en tu navegador. Revísalo; puedes copiarlo o volver a editar.</p><div class="summary" id="summary-text"></div><div class="button-row"><button type="button" class="btn btn-outline" id="copy-summary">Copiar resumen ${arrow}</button><button type="button" class="btn btn-outline" id="edit-form">Editar</button></div><p class="small" id="copy-status" role="status" style="margin:12px 0 0"></p>`;
  res.querySelector('#summary-text').textContent=summary;
  res.hidden=false;res.focus();
  const status=res.querySelector('#copy-status');
  res.querySelector('#copy-summary').addEventListener('click',async()=>{
   try{await navigator.clipboard.writeText(summary);status.textContent='Resumen copiado. Ningún dato fue enviado.'}
   catch(err){const t=document.createElement('textarea');t.value=summary;t.setAttribute('aria-hidden','true');document.body.appendChild(t);t.select();try{document.execCommand('copy');status.textContent='Resumen copiado. Ningún dato fue enviado.'}catch(e2){status.textContent='No fue posible copiar automáticamente; selecciona el texto y cópialo.'}t.remove()}
  });
  res.querySelector('#edit-form').addEventListener('click',()=>{res.hidden=true;f.elements.nombre.focus()});
 });
 f.addEventListener('input',e=>{const el=e.target;if(el.getAttribute&&el.getAttribute('aria-invalid')){el.removeAttribute('aria-invalid');el.removeAttribute('aria-describedby');const er=document.getElementById('err-'+el.id);if(er)er.remove()}});
}
function setupDiag(){
 const root=document.getElementById('diag');if(!root)return;
 let i=0;const ans=Array(DIAG.length).fill(null);let first=true;
 const progress=()=>`<ol class="progress" aria-hidden="true">${DIAG.map((_,k)=>`<li class="${k<i?'done':k===i?'now':''}"></li>`).join('')}</ol>`;
 function question(){
  const q=DIAG[i];
  root.innerHTML=`${progress()}<form id="dq" novalidate><fieldset><legend tabindex="-1" id="dleg"><span class="topic-label">Pregunta ${i+1} de ${DIAG.length}</span>${q[0]}</legend>${q[1].map((o,k)=>`<label class="opt${ans[i]===k?' is-checked':''}"><input type="radio" name="q" value="${k}" ${ans[i]===k?'checked':''}><span>${o[1]}</span></label>`).join('')}</fieldset><p class="field-error" id="dq-err" role="alert" hidden>Elige una opción para continuar.</p><div class="diag-nav"><button type="button" class="btn btn-outline" id="dback" ${i===0?'disabled style="visibility:hidden"':''}>Anterior</button><button type="submit" class="btn btn-dark">${i===DIAG.length-1?'Ver resultado':'Siguiente'} ${arrow}</button></div></form>`;
  if(!first)document.getElementById('dleg').focus();first=false;
  const form=document.getElementById('dq');
  form.addEventListener('submit',e=>{e.preventDefault();const c=form.querySelector('input:checked');if(!c){document.getElementById('dq-err').hidden=false;form.querySelector('input').focus();return}ans[i]=+c.value;if(i<DIAG.length-1){i++;question()}else result()});
  form.addEventListener('change',()=>{document.getElementById('dq-err').hidden=true;form.querySelectorAll('.opt').forEach(o=>o.classList.toggle('is-checked',o.querySelector('input').checked))});
  const back=document.getElementById('dback');if(back)back.addEventListener('click',()=>{const c=form.querySelector('input:checked');if(c)ans[i]=+c.value;i--;question()});
 }
 function result(){
  const score=Object.fromEntries(TERR.map(t=>[t.id,0]));ans.forEach((a,k)=>{score[DIAG[k][1][a][0]]++});
  const order=TERR.map(t=>t.id).sort((a,b)=>score[b]-score[a]);const top=score[order[0]];const leaders=order.filter(id=>score[id]===top);
  const names=leaders.map(id=>byId(TERR,id));
  root.innerHTML=`<div class="result-card" id="dres" tabindex="-1"><span class="topic-label">Resultado orientativo</span><h2>${names.length===1?`Conviene explorar primero: <span class="serif">${names[0].short.toLowerCase()}.</span>`:`Dos desafíos empatan: <span class="serif">${names.map(n=>n.short.toLowerCase()).join(' y ')}.</span>`}</h2><p class="lead muted">${names.map(n=>n.desc).join(' ')}</p><ul class="bars" aria-label="Coincidencia por desafío">${order.map(id=>`<li><span>${byId(TERR,id).short}</span><span class="bar" aria-hidden="true"><i style="width:${score[id]/DIAG.length*100}%"></i></span><span>${score[id]} de ${DIAG.length}</span></li>`).join('')}</ul><div class="button-row">${names.map(n=>A(`Explorar: ${n.short}`,`#solucion/${n.id}`,'btn btn-dark')).join('')}${A(CTA,`#contacto/${names[0].id}`,'btn btn-outline')}</div><p class="small muted" style="margin:22px 0 0">Es una orientación inicial basada en tus respuestas, no un diagnóstico organizacional. No se guardó ni se envió nada. <button type="button" id="dredo" class="link-u" style="background:none;border:0;padding:0;font-weight:700;min-height:44px">Volver a empezar</button></p></div>`;
  document.getElementById('dres').focus();
  document.getElementById('dredo').addEventListener('click',()=>{i=0;ans.fill(null);first=false;question()});
 }
 question();
}

mación, talento y cultura · NODO","Agenda editorial de NODO sobre transformación, talento, liderazgo, cultura y nuevas formas de trabajo. Los artículos se publicarán con autor, fecha y fuentes."],"contacto":["Contacto: conversemos de tu desafío organizacional · NODO","Cuéntanos qué ocurre en tu organización y qué te gustaría explorar, y acordemos una primera conversación exploratoria sin compromiso con NODO."],"diagnostico":["Autodiagnóstico: qué desafío explorar primero · NODO","Cinco preguntas para identificar qué desafío conviene explorar primero. El resultado se calcula en tu navegador y no se envían ni se guardan datos."]};
function routeKey(){let r;try{r=decodeURIComponent(location.hash.replace(/^#/,''))}catch(e){return''}r=r.replace(/^\/+|\/+$/g,'');return(!r||r==='contenido')?'inicio':r}
function resolve(){
 let raw=location.hash.replace(/^#/,''),r;
 try{r=decodeURIComponent(raw)}catch(e){r='__invalido__'}
 r=r.replace(/^\/+|\/+$/g,'');
 if(!r||r==='contenido')r='inicio';
 const parts=r.split('/'),page=parts[0],id=parts[1],n=parts.length;
 const nf={page:'nf',html:notFoundPage(),meta:META.nf};
 if(n>2)return nf;
 switch(page){
  case 'inicio':return n===1?{page,html:home(),meta:META.inicio,setup:setupHero}:nf;
  case 'soluciones':if(n===1||id==='servicios')return {page,html:solutionsPage(),meta:id==='servicios'?['Especialidades · NODO','Las ocho líneas de servicio de NODO con sus áreas de intervención: estructura, trabajo, cambio, talento, formación, coaching, cultura y bienestar.']:META.soluciones,setup:()=>setupSolutions(id==='servicios'?'service':'challenge'),scrollTo:id==='servicios'?'.switch':null};return nf;
  case 'solucion':{const s=byId(TERR,id);return s?{page,html:detailPage(s),meta:[`${s.short} · NODO`,s.desc]}:nf}
  case 'especialidad':{const c=byId(SPEC,id);return c?{page,html:specialtyPage(c),meta:[`${c.name} · NODO`,c.lead]}:nf}
  case 'nosotros':case 'metodo':case 'insights':case 'diagnostico':case 'notas':
   if(n!==1)return nf;
   return {page,html:{nosotros:aboutPage,metodo:methodPage,insights:insightsPage,diagnostico:diagPage,notas:notesPage}[page](),meta:META[page],setup:page==='diagnostico'?setupDiag:null};
  case 'insight':{const a=byId(ARTICLES,id);return a?{page,html:insightDetailPage(a),meta:[`${a.title} · NODO`,a.desc]}:nf}
  case 'contacto':if(n===1||byId(TERR,id))return {page,html:contactPage(id),meta:id?[`Contacto sobre ${byId(TERR,id).short.toLowerCase()} · NODO`,META.contacto[1]]:META.contacto,setup:setupContact};return nf;
  default:return nf;
 }
}
function setMeta(m,noindex){
 document.title=m[0];
 const set=(sel,attr,val)=>{let el=document.querySelector(sel);if(!el){el=document.createElement('meta');const mm=sel.match(/\[(name|property)="([^"]+)"\]/);el.setAttribute(mm[1],mm[2]);document.head.appendChild(el)}el.setAttribute(attr,val)};
 set('meta[name="description"]','content',m[1]);set('meta[property="og:title"]','content',m[0]);set('meta[property="og:description"]','content',m[1]);set('meta[property="og:type"]','content','website');set('meta[property="og:locale"]','content','es_LA');
 set('meta[name="robots"]','content',noindex?'noindex,follow':'index,follow');
}
function render(moveFocus){
 const r=resolve();currentPage=r.page;
 const main=document.getElementById('contenido');
 main.innerHTML=r.html;
 updateNav(r.page);setMenu(false);setMeta(r.page!=='nf'&&SEO[routeKey()]?SEO[routeKey()]:r.meta,r.page==='insight'||r.page==='notas'||r.page==='nf');
 if(r.setup)r.setup();
 if(r.scrollTo){const el=document.querySelector(r.scrollTo);if(el)el.scrollIntoView({block:'center',behavior:'auto'})}else if(moveFocus!==false)window.scrollTo({top:0,behavior:'auto'});
 if(moveFocus!==false&&hasRendered){const h=main.querySelector('h1');if(h)h.focus({preventScroll:true});else main.focus({preventScroll:true})}
 hasRendered=true;
}
